<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Cribble — a simple, fast way to explore the web.">
<title>Cribble — Search the web</title>
<style>
  :root { color-scheme: light; --ink:#202124; --muted:#5f6368; --line:#dfe1e5; --blue:#1a73e8; --surface:#f8f9fa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; display:flex; flex-direction:column; }
  header { height:60px; display:flex; align-items:center; justify-content:flex-end; gap:20px; padding:0 28px; font-size:13px; }
  header a { color:var(--ink); text-decoration:none; }
  header a:hover { text-decoration:underline; }
  .avatar { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#e8f0fe; color:#174ea6; font-weight:700; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; padding: min(13vh,120px) 20px 48px; }
  .brand { font-size:clamp(54px,9vw,88px); font-weight:700; letter-spacing:-5px; margin:0 0 30px; user-select:none; }
  .brand span:nth-child(1), .brand span:nth-child(4) { color:#4285f4; }
  .brand span:nth-child(2) { color:#ea4335; }
  .brand span:nth-child(3) { color:#fbbc05; }
  .brand span:nth-child(5) { color:#34a853; }
  .tagline { margin:-20px 0 28px; color:var(--muted); font-size:14px; }
  form { width:min(584px,100%); }
  .searchbox { display:flex; align-items:center; gap:12px; width:100%; height:52px; padding:0 16px; border:1px solid var(--line); border-radius:28px; transition:box-shadow .18s,border-color .18s; }
  .searchbox:hover, .searchbox:focus-within { box-shadow:0 1px 6px #20212433; border-color:transparent; }
  .search-icon { width:20px; height:20px; color:#9aa0a6; flex:none; }
  input { border:0; outline:0; flex:1; min-width:0; font-size:16px; color:var(--ink); background:transparent; }
  .clear { border:0; background:none; color:var(--muted); cursor:pointer; font-size:20px; padding:4px; display:none; }
  .clear.show { display:block; }
  .actions { display:flex; justify-content:center; gap:12px; margin:28px 0 24px; }
  .actions button { border:1px solid transparent; border-radius:5px; padding:10px 16px; font-size:14px; background:var(--surface); color:#3c4043; cursor:pointer; }
  .actions button:hover { border-color:#dadce0; box-shadow:0 1px 1px #00000010; }
  .hint { color:var(--muted); font-size:13px; text-align:center; line-height:1.6; }
  .hint strong { color:#4285f4; font-weight:500; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:18px; max-width:600px; }
  .chip { background:#f1f3f4; border:1px solid transparent; color:#3c4043; padding:8px 13px; border-radius:18px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:#dadce0; background:#fff; }
  footer { background:#f2f2f2; color:var(--muted); font-size:14px; }
  .region { padding:15px 30px; border-bottom:1px solid #dadce0; }
  .footlinks { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:15px 30px; flex-wrap:wrap; }
  .footgroup { display:flex; gap:24px; flex-wrap:wrap; }
  footer a { color:var(--muted); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
  @media(max-width:600px) { header{padding:0 18px;} main{padding-top:12vh;} .brand{letter-spacing:-3px;} .footlinks{justify-content:center;padding:15px 20px;} .region{text-align:center;} }
</style>
</head>
<body>
<header>
  <a href="https://duckduckgo.com/" target="_blank" rel="noopener">Web</a>
  <a href="#about" id="aboutLink">About</a>
  <div class="avatar" title="Cribble">C</div>
</header>
<main>
  <h1 class="brand" aria-label="Cribble"><span>C</span><span>r</span><span>i</span><span>b</span><span>b</span><span>l</span><span>e</span></h1>
  <p class="tagline">A little curiosity goes a long way.</p>
  <form id="searchForm" role="search">
    <div class="searchbox">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="query" type="search" name="q" autocomplete="off" aria-label="Search the web" placeholder="Search the web with Cribble">
      <button class="clear" id="clearBtn" type="button" aria-label="Clear search">×</button>
    </div>
    <div class="actions">
      <button type="submit">Cribble Search</button>
      <button type="button" id="luckyBtn">Surprise me</button>
    </div>
  </form>
  <div class="hint">Explore the web with <strong>Cribble</strong></div>
  <div class="chips" aria-label="Popular searches">
    <button class="chip" data-query="latest technology news">Technology</button>
    <button class="chip" data-query="learn something new today">Learn something</button>
    <button class="chip" data-query="beautiful places to visit">Travel ideas</button>
    <button class="chip" data-query="easy recipes for dinner">Recipes</button>
  </div>
</main>
<footer>
  <div class="region">Cribble · Your starting point for the web</div>
  <div class="footlinks">
    <div class="footgroup"><a href="#about" id="footerAbout">About Cribble</a><a href="https://duckduckgo.com/privacy" target="_blank" rel="noopener">Privacy</a></div>
    <div class="footgroup"><a href="https://duckduckgo.com/" target="_blank" rel="noopener">Search provider</a><a href="#help" id="helpLink">Help</a></div>
  </div>
</footer>
<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('query');
  const clearBtn = document.getElementById('clearBtn');
  function search(query) {
    const q = (query || '').trim();
    if (!q) { input.focus(); return; }
    // Cribble's starter version uses DuckDuckGo to deliver live web results.
    window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
  }
  form.addEventListener('submit', e => { e.preventDefault(); search(input.value); });
  input.addEventListener('input', () => clearBtn.classList.toggle('show', input.value.length > 0));
  clearBtn.addEventListener('click', () => { input.value=''; clearBtn.classList.remove('show'); input.focus(); });
  document.querySelectorAll('[data-query]').forEach(button => button.addEventListener('click', () => search(button.dataset.query)));
  document.getElementById('luckyBtn').addEventListener('click', () => {
    const ideas = ['interesting facts about space','how the internet works','inspiring inventions','wildlife photography','free online learning resources'];
    search(ideas[Math.floor(Math.random() * ideas.length)]);
  });
  function info(title, message) { alert(title + '\\n\\n' + message); }
  document.getElementById('aboutLink').addEventListener('click', e => { e.preventDefault(); info('About Cribble', 'Cribble is a simple search homepage. This starter version sends searches to DuckDuckGo for live web results.'); });
  document.getElementById('footerAbout').addEventListener('click', e => { e.preventDefault(); info('About Cribble', 'Cribble is a simple search homepage. This starter version sends searches to DuckDuckGo for live web results.'); });
  document.getElementById('helpLink').addEventListener('click', e => { e.preventDefault(); info('Cribble Help', 'Type a search and press Enter or choose Cribble Search. Your query opens in the search provider.'); });
</script>
</body>
</html>
